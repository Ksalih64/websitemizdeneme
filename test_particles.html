<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #000; color: #fff; margin: 0; height: 200vh; }
  .particles-global { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; border: 2px solid red; }
  .section { background: #111; padding: 100px; position: relative; z-index: 1; }
  .content { position: relative; z-index: 2; }
</style>
<script src="js/analytics.js" defer></script>
</head>
<body>
  <div id="particles-bg" class="particles-global"></div>
  <section class="section">
    <div class="content">Section Content</div>
  </section>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-bg', {
      particles: { number: { value: 60 }, color: { value: '#ffffff' }, size: { value: 5 } }
    });
  </script>
</body>
</html>
