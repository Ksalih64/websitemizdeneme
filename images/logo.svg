<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d078"/>
      <stop offset="50%" style="stop-color:#d4a855"/>
      <stop offset="100%" style="stop-color:#bc8c3d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Circle -->
  <circle cx="30" cy="30" r="26" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="30" cy="30" r="23" fill="none" stroke="#080d18" stroke-width="1.5"/>
  
  <!-- KMZ Text in Circle -->
  <text x="30" y="36" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#080d18" text-anchor="middle">KMZ</text>
  
  <!-- TRADE Text -->
  <text x="70" y="38" font-family="Outfit, sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="6">TRADE</text>
  
  <!-- Tagline -->
  <text x="70" y="52" font-family="Inter, sans-serif" font-size="8" fill="#8b9dc3" letter-spacing="1.5">PREMIUM QUALITY</text>
</svg>
